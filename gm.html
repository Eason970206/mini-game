<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中控台 Console - 三方對決 RPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-6">

    <main class="max-w-7xl w-full mx-auto space-y-6">
        <div class="flex flex-wrap items-center justify-between border-b border-slate-800 pb-4 gap-4">
            <div>
                <h1 class="text-2xl font-black text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i> 中控台主控面板
                </h1>
                <p class="text-xs text-slate-400 mt-0.5">即時檢視玩家決策、獨立控制掀牌與回合推進</p>
            </div>

            <div class="flex gap-2">
                <button onclick="resetRound()" class="px-4 py-2 bg-amber-600/20 hover:bg-amber-600/30 text-amber-400 border border-amber-500/30 font-bold rounded-xl text-xs transition">
                    <i class="fa-solid fa-arrows-rotate mr-1"></i> 開啟下一回合
                </button>
                <button onclick="resetGame()" class="px-4 py-2 bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-500/30 font-bold rounded-xl text-xs transition">
                    <i class="fa-solid fa-power-off mr-1"></i> 完全重置遊戲
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="gm-panels-container"></div>
    </main>

    <script>
        // 安全驗證：未登入則踢回 login.html
        if (sessionStorage.getItem('gm_authenticated') !== 'true') {
            window.location.href = 'login.html';
        }

        let gameState = {
            round: 1,
            players: {
                p1: { name: '玩家 A', lives: 3, target: null, gesture: null, locked: false, revealTarget: false, revealGesture: false },
                p2: { name: '玩家 B', lives: 3, target: null, gesture: null, locked: false, revealTarget: false, revealGesture: false },
                p3: { name: '玩家 C', lives: 3, target: null, gesture: null, locked: false, revealTarget: false, revealGesture: false }
            },
            resolvedAttacks: []
        };

        const broadcastChannel = new BroadcastChannel('rps_game_sync');

        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            renderUI();

            broadcastChannel.onmessage = (e) => {
                if (e.data && e.data.type === 'STATE_UPDATE') {
                    gameState = e.data.state;
                    renderUI();
                }
            };
        });

        function loadState() {
            const saved = localStorage.getItem('rps_game_state');
            if (saved) { try { gameState = JSON.parse(saved); } catch(e){} }
        }

        function saveAndBroadcast() {
            localStorage.setItem('rps_game_state', JSON.stringify(gameState));
            broadcastChannel.postMessage({ type: 'STATE_UPDATE', state: gameState });
            renderUI();
        }

        function renderUI() {
            const container = document.getElementById('gm-panels-container');
            container.innerHTML = '';
            const gestureNames = { rock: '✊ 石頭', scissors: '✌️ 剪刀', paper: '🖐️ 布' };

            ['p1', 'p2', 'p3'].forEach(pid => {
                const p = gameState.players[pid];
                const panel = document.createElement('div');
                panel.className = 'bg-slate-800/80 border border-slate-700 rounded-2xl p-5 space-y-4';

                let heartsHtml = '';
                for (let i = 0; i < 3; i++) {
                    heartsHtml += `<i class="${i < p.lives ? 'fa-solid fa-heart' : 'fa-regular fa-heart opacity-30'} text-rose-500 text-sm mr-1"></i>`;
                }

                panel.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-mono font-bold text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded">${pid.toUpperCase()}</span>
                        <div class="flex">${heartsHtml}</div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">修改姓名</label>
                        <input type="text" id="name-${pid}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm font-bold text-white focus:outline-none focus:border-amber-500" value="${p.name}">
                    </div>

                    <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800 space-y-1 text-xs font-mono">
                        <div class="text-[10px] text-slate-500 font-bold uppercase mb-1">後台提交數據 (RAW)</div>
                        <div class="flex justify-between"><span class="text-slate-400">選擇對象:</span> <span class="font-bold text-amber-300">${p.target ? gameState.players[p.target].name : '--'}</span></div>
                        <div class="flex justify-between"><span class="text-slate-400">選擇手勢:</span> <span class="font-bold text-rose-400">${p.gesture ? gestureNames[p.gesture] : '--'}</span></div>
                    </div>

                    <div class="space-y-2 pt-2 border-t border-slate-700/60">
                        <div class="text-[10px] font-bold text-slate-400 uppercase">獨立大螢幕揭曉控制</div>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="reveal('${pid}', 'target')" ${!p.locked || p.revealTarget ? 'disabled' : ''} class="w-full py-2 px-2 ${p.revealTarget ? 'bg-rose-900/50 text-rose-300' : 'bg-slate-700 hover:bg-rose-600'} text-white font-bold rounded-lg text-xs transition disabled:opacity-40">
                                <i class="fa-solid fa-eye mr-1"></i> 公布對象
                            </button>
                            <button onclick="reveal('${pid}', 'gesture')" ${!p.locked || p.revealGesture ? 'disabled' : ''} class="w-full py-2 px-2 ${p.revealGesture ? 'bg-amber-900/50 text-amber-300' : 'bg-slate-700 hover:bg-amber-600'} text-white font-bold rounded-lg text-xs transition disabled:opacity-40">
                                <i class="fa-solid fa-hand mr-1"></i> 公布手勢
                            </button>
                        </div>
                    </div>
                `;

                container.appendChild(panel);

                document.getElementById(`name-${pid}`).addEventListener('change', (e) => {
                    gameState.players[pid].name = e.target.value.trim() || `玩家 ${pid.toUpperCase()}`;
                    saveAndBroadcast();
                });
            });
        }

        function reveal(pid, type) {
            if (type === 'target') gameState.players[pid].revealTarget = true;
            if (type === 'gesture') gameState.players[pid].revealGesture = true;
            
            checkAutoDeductLives();
            saveAndBroadcast();
        }

        function checkAutoDeductLives() {
            ['p1', 'p2', 'p3'].forEach(aId => {
                const attacker = gameState.players[aId];
                const dId = attacker.target;
                if (!dId) return;
                const defender = gameState.players[dId];

                // 核心邏輯：只要 A選擇B、A手勢、B手勢 3 者公佈時，即刻判定並扣血
                if (attacker.revealTarget && attacker.revealGesture && defender.revealGesture) {
                    const pairKey = `${aId}->${dId}`;
                    if (!gameState.resolvedAttacks.includes(pairKey)) {
                        gameState.resolvedAttacks.push(pairKey);

                        const res = judgeRPS(attacker.gesture, defender.gesture);
                        if (res === 'LOSE') {
                            attacker.lives = Math.max(0, attacker.lives - 1);
                        } else if (res === 'WIN') {
                            defender.lives = Math.max(0, defender.lives - 1);
                        }
                    }
                }
            });
        }

        function judgeRPS(g1, g2) {
            if (g1 === g2) return 'DRAW';
            if ((g1 === 'rock' && g2 === 'scissors') || (g1 === 'scissors' && g2 === 'paper') || (g1 === 'paper' && g2 === 'rock')) return 'WIN';
            return 'LOSE';
        }

        function resetRound() {
            gameState.round += 1;
            gameState.resolvedAttacks = [];
            ['p1', 'p2', 'p3'].forEach(pid => {
                gameState.players[pid].target = null;
                gameState.players[pid].gesture = null;
                gameState.players[pid].locked = false;
                gameState.players[pid].revealTarget = false;
                gameState.players[pid].revealGesture = false;
            });
            saveAndBroadcast();
        }

        function resetGame() {
            if (confirm('確定重置整場遊戲？')) {
                gameState = {
                    round: 1,
                    players: {
                        p1: { name: '玩家 A', lives: 3, target: null, gesture: null, locked: false, revealTarget: false, revealGesture: false },
                        p2: { name: '玩家 B', lives: 3, target: null, gesture: null, locked: false, revealTarget: false, revealGesture: false },
                        p3: { name: '玩家 C', lives: 3, target: null, gesture: null, locked: false, revealTarget: false, revealGesture: false }
                    },
                    resolvedAttacks: []
                };
                saveAndBroadcast();
            }
        }
    </script>
</body>
</html>
