<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM 控制台 - 多方戰術對決</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-white">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-user-shield text-amber-400 text-3xl"></i>
                <div>
                    <span class="font-extrabold text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-rose-500">GM 遊戲管理員控制台</span>
                    <span class="text-xs text-slate-400 block">Game Master Central Control</span>
                </div>
            </div>
            
            <button onclick="lockGMConsole()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs font-bold transition">
                <i class="fa-solid fa-lock mr-1"></i> 鎖定控制台
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">

        <!-- GM Control Panel -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
                <div>
                    <span id="gm-player-count-tag" class="bg-amber-500/20 text-amber-400 text-xs font-bold px-3 py-1 rounded-full border border-amber-500/30">
                        3 人賽制
                    </span>
                    <h1 class="text-2xl font-black text-white mt-2">
                        目前進行：第 <span id="gm-round-num" class="text-amber-400">1</span> 回合
                    </h1>
                </div>

                <!-- 回合結算控制 -->
                <div>
                    <button onclick="nextRound()" class="px-5 py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-sm transition shadow-lg flex items-center space-x-2">
                        <i class="fa-solid fa-forward"></i>
                        <span>進入下一回合 (清空選擇與重置)</span>
                    </button>
                </div>
            </div>

            <!-- 人數設定與房間重置 -->
            <div class="flex flex-wrap justify-between items-center gap-4 text-sm">
                <div class="flex items-center space-x-2">
                    <span class="text-slate-400 font-bold">賽制人數切換：</span>
                    <button onclick="changePlayerLimit(3)" id="btn-p-3" class="px-3 py-1 rounded-lg text-xs font-bold border">3 人</button>
                    <button onclick="changePlayerLimit(4)" id="btn-p-4" class="px-3 py-1 rounded-lg text-xs font-bold border">4 人</button>
                    <button onclick="changePlayerLimit(5)" id="btn-p-5" class="px-3 py-1 rounded-lg text-xs font-bold border">5 人</button>
                </div>

                <button onclick="resetGameWithPins()" class="px-4 py-2 bg-rose-600/20 border border-rose-500/40 text-rose-400 hover:bg-rose-600 hover:text-white rounded-xl font-bold text-xs transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>重置對決並重新派發 PIN 碼</span>
                </button>
            </div>
        </div>

        <!-- 玩家面板管理卡片區 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="gm-cards-container"></div>

        <!-- GM 監控 Log -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg">
            <div class="flex items-center space-x-2 text-xs font-bold text-slate-400 mb-2">
                <i class="fa-solid fa-shield-cat text-amber-400"></i>
                <span>GM 即時對決紀錄監控</span>
            </div>
            <div id="gm-log-box" class="text-xs space-y-1 font-mono text-slate-300 max-h-32 overflow-y-auto bg-slate-950 p-3 rounded-lg border border-slate-800">
                <div>[GM 系統] 主控台成功驗證登入。</div>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 p-4 text-center text-slate-500 text-xs">
        三方/多方對決策略猜拳 Tactical RPS System &copy; 2026 GM Control Terminal
    </footer>

    <script>
        const GM_PASSWORD = "8888"; // GM 通行密碼

        function checkGMAccess() {
            const auth = sessionStorage.getItem('gm_auth');
            if (auth !== 'true') {
                const inputPwd = prompt("【安全防護】請輸入 GM 主控台通行密碼：");
                if (inputPwd === GM_PASSWORD) {
                    sessionStorage.setItem('gm_auth', 'true');
                } else {
                    alert("密碼錯誤！禁止存取控制台。");
                    window.location.href = "login.html";
                }
            }
        }
        checkGMAccess();

        function lockGMConsole() {
            sessionStorage.removeItem('gm_auth');
            window.location.href = "login.html";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyDKhojw0MWwn88AmP-tG9lOe9Q67RNRt7g",
            authDomain: "mini-game-214dd.firebaseapp.com",
            databaseURL: "https://mini-game-214dd-default-rtdb.firebaseio.com",
            projectId: "mini-game-214dd",
            storageBucket: "mini-game-214dd.firebasestorage.app",
            messagingSenderId: "972053611236",
            appId: "1:972053611236:web:d972943853d27d7a8962f1",
            measurementId: "G-55RXYHLB3H"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const AVATARS = [
            'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
            'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80',
            'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80',
            'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150&auto=format&fit=crop&q=80',
            'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=150&auto=format&fit=crop&q=80'
        ];

        let gameState = { playerCount: 3, round: 1, players: {} };

        function generateRandomPin() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        function initPlayers(count) {
            const players = {};
            for (let i = 1; i <= count; i++) {
                const pid = `p${i}`;
                players[pid] = {
                    id: pid,
                    name: `玩家 ${String.fromCharCode(64 + i)}`,
                    lives: 3,
                    pin: generateRandomPin(),
                    target: "",
                    gesture: null,
                    locked: false,
                    revealTarget: false,
                    revealGesture: false,
                    avatar: AVATARS[i - 1]
                };
            }
            return players;
        }

        window.addEventListener('DOMContentLoaded', () => {
            db.ref('rps_game_state').on('value', (snapshot) => {
                const val = snapshot.val();
                if (val && val.players) {
                    gameState = val;
                    renderGMUI();
                } else {
                    gameState.playerCount = 3;
                    gameState.players = initPlayers(3);
                    db.ref('rps_game_state').set(gameState);
                }
            });
        });

        function renderGMUI() {
            document.getElementById('gm-round-num').textContent = gameState.round;
            document.getElementById('gm-player-count-tag').textContent = `${gameState.playerCount} 人賽制`;

            const container = document.getElementById('gm-cards-container');
            container.innerHTML = '';

            if (gameState.playerCount === 4) {
                container.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6";
            } else if (gameState.playerCount === 5) {
                container.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4";
            } else {
                container.className = "grid grid-cols-1 md:grid-cols-3 gap-6";
            }

            const gestureIcons = { rock: '✊ 石頭', scissors: '✌️ 剪刀', paper: '🖐️ 布' };

            Object.keys(gameState.players).forEach(pid => {
                const p = gameState.players[pid] || {};
                const isDead = (p.lives <= 0);

                const card = document.createElement('div');
                card.className = `bg-slate-900 border rounded-2xl p-5 shadow-xl flex flex-col justify-between space-y-4 transition-all ${
                    isDead ? 'border-rose-900/50 opacity-60 grayscale' : 'border-slate-800'
                }`;

                let heartsHtml = '';
                for (let i = 0; i < 3; i++) {
                    heartsHtml += `<i class="${i < p.lives ? 'fa-solid fa-heart text-rose-500' : 'fa-regular fa-heart opacity-30 text-slate-500'} text-sm mr-1"></i>`;
                }

                card.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex justify-between items-start">
                            <div class="flex items-center space-x-3">
                                <img class="w-12 h-12 rounded-full border border-slate-700 object-cover" src="${p.avatar || AVATARS[0]}">
                                <div>
                                    <h3 class="font-bold text-white text-base flex items-center gap-2">
                                        ${p.name}
                                        ${isDead ? '<span class="text-[10px] bg-rose-600 text-white px-1.5 py-0.5 rounded font-normal">死亡</span>' : ''}
                                    </h3>
                                    <div class="flex items-center mt-0.5">${heartsHtml}</div>
                                </div>
                            </div>
                        </div>

                        <!-- PIN 碼與狀態 -->
                        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="text-xs text-slate-400 font-bold">登入 PIN 碼：</span>
                                <span class="font-mono font-black text-amber-400 text-lg bg-slate-900 px-2.5 py-0.5 rounded border border-slate-700">${p.pin}</span>
                            </div>
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-slate-400">鎖定狀態：</span>
                                <span class="font-bold ${p.locked ? 'text-emerald-400' : 'text-slate-500'}">
                                    ${p.locked ? '🔒 已送出' : '⏳ 填寫中'}
                                </span>
                            </div>
                        </div>

                        <!-- 決策預覽 (GM 可看) -->
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div class="bg-slate-800/80 p-2.5 rounded-xl border border-slate-700/80">
                                <div class="text-slate-400 font-bold mb-1">指定目標</div>
                                <div class="font-black text-rose-400 truncate">${p.target && gameState.players[p.target] ? gameState.players[p.target].name : '--'}</div>
                            </div>
                            <div class="bg-slate-800/80 p-2.5 rounded-xl border border-slate-700/80">
                                <div class="text-slate-400 font-bold mb-1">選擇手勢</div>
                                <div class="font-black text-amber-300">${p.gesture ? gestureIcons[p.gesture] : '--'}</div>
                            </div>
                        </div>

                        <!-- 單獨公布按鈕區 -->
                        <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800">
                            <button onclick="toggleReveal('${pid}', 'target')" class="py-2 px-3 rounded-xl text-xs font-bold border transition flex items-center justify-center space-x-1 ${
                                p.revealTarget 
                                ? 'bg-rose-600 text-white border-rose-500 shadow-md shadow-rose-950/50' 
                                : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'
                            }">
                                <i class="fa-solid ${p.revealTarget ? 'fa-eye' : 'fa-eye-slash'}"></i>
                                <span>${p.revealTarget ? '目標已揭曉' : '揭曉目標'}</span>
                            </button>

                            <button onclick="toggleReveal('${pid}', 'gesture')" class="py-2 px-3 rounded-xl text-xs font-bold border transition flex items-center justify-center space-x-1 ${
                                p.revealGesture 
                                ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-md shadow-amber-950/50' 
                                : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'
                            }">
                                <i class="fa-solid ${p.revealGesture ? 'fa-hand' : 'fa-hand-back-fist'}"></i>
                                <span>${p.revealGesture ? '手勢已揭曉' : '揭曉手勢'}</span>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            updateModalButtons();
        }

        function toggleReveal(pid, type) {
            const currentStatus = type === 'target' ? gameState.players[pid].revealTarget : gameState.players[pid].revealGesture;
            const updateObj = {};
            if (type === 'target') updateObj[`rps_game_state/players/${pid}/revealTarget`] = !currentStatus;
            if (type === 'gesture') updateObj[`rps_game_state/players/${pid}/revealGesture`] = !currentStatus;
            db.ref().update(updateObj);
        }

        function updateModalButtons() {
            [3, 4, 5].forEach(num => {
                const btn = document.getElementById(`btn-p-${num}`);
                if (!btn) return;
                if (num === gameState.playerCount) {
                    btn.className = "px-3 py-1 rounded-lg text-xs font-bold border bg-amber-500 border-amber-400 text-slate-950 shadow-md";
                } else {
                    btn.className = "px-3 py-1 rounded-lg text-xs font-bold border bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700";
                }
            });
        }

        function changePlayerLimit(count) {
            if (confirm(`【GM 指令】確定要變更為 ${count} 人賽制並重置局數與 PIN 碼嗎？`)) {
                gameState.playerCount = count;
                gameState.round = 1;
                gameState.players = initPlayers(count);
                gameState.gameOver = false;
                db.ref('rps_game_state').set(gameState);
            }
        }

        function resetGameWithPins() {
            if (confirm("【GM 指令】確定要重置比賽並生成新的 PIN 碼嗎？")) {
                gameState.round = 1;
                gameState.gameOver = false;
                gameState.players = initPlayers(gameState.playerCount);
                db.ref('rps_game_state').set(gameState);
            }
        }

        function nextRound() {
            gameState.round += 1;
            Object.keys(gameState.players).forEach(pid => {
                const p = gameState.players[pid];
                if (p) {
                    p.target = "";
                    p.gesture = null;
                    p.locked = false;
                    p.revealTarget = false;
                    p.revealGesture = false;
                }
            });
            db.ref('rps_game_state').set(gameState);
        }
    </script>
</body>
</html>
