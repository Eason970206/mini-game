<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三方/多方對決策略猜拳 - 觀賽大螢幕</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .flip-card { perspective: 1000px; }
        .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .flip-card-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-rose-500 selection:text-white">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-shield-halved text-rose-500 text-3xl"></i>
                <span class="font-extrabold text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-rose-500 to-amber-400">多方戰術對決 Arena</span>
            </div>
            
            <div class="flex items-center space-x-3">
                <!-- GM 專屬按鈕：預設隱藏 (hidden)，只有 GM 端會透過 JS 開啟 -->
                <button id="gm-control-btn" onclick="toggleSetupModal()" class="hidden px-4 py-2 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 font-bold text-sm transition border border-amber-500/40 flex items-center space-x-2 shadow-lg">
                    <i class="fa-solid fa-user-gear text-amber-400"></i>
                    <span>⚙️ GM 控制台 (PIN碼設定)</span>
                </button>

                <a href="login.html" target="_blank" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm transition shadow-lg shadow-rose-950/50 flex items-center space-x-1">
                    <i class="fa-solid fa-right-to-bracket mr-1"></i> 登入門戶
                </a>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
        
        <!-- Dashboard Top Banner -->
        <div class="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 border border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col md:flex-row items-center justify-between gap-6">
            <div>
                <div class="flex items-center space-x-2">
                    <span class="bg-rose-500/20 text-rose-400 text-xs font-extrabold px-3 py-1 rounded-full uppercase tracking-wider border border-rose-500/30">
                        嚴格競賽模式 (Strict System Rule)
                    </span>
                    <span id="player-count-tag" class="bg-amber-500/20 text-amber-400 text-xs font-bold px-3 py-1 rounded-full border border-amber-500/30">
                        3 人賽制
                    </span>
                    <!-- GM 端提示標記 -->
                    <span id="gm-badge" class="hidden bg-emerald-500/20 text-emerald-400 text-xs font-bold px-3 py-1 rounded-full border border-emerald-500/30">
                        👑 管理員模式
                    </span>
                </div>
                <h1 class="text-3xl md:text-4xl font-black text-white mt-2">
                    第 <span id="spec-round-num" class="text-amber-400">1</span> 回合 觀賽大螢幕
                </h1>
                <p class="text-slate-400 text-sm mt-1">請使用手機掃描右側 QR Code 進入登入頁面</p>
            </div>

            <!-- QRCode Card -->
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 flex items-center space-x-4 shadow-inner">
                <div id="qrcode-container" class="bg-white p-1 rounded-lg flex items-center justify-center">
                    <img id="qr-img" src="" alt="QR Code" class="w-20 h-20">
                </div>
                <div class="text-xs space-y-1">
                    <div class="font-bold text-slate-300">掃描加入賽局</div>
                    <div class="text-slate-500">掃碼輸入 PIN 碼參與</div>
                </div>
            </div>
        </div>

        <!-- 玩家 Cards Dynamic Grid Container -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="spec-cards-container"></div>

        <!-- 系統比對 Console Log -->
        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl shadow-lg">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center space-x-2 text-xs font-bold text-slate-400">
                    <i class="fa-solid fa-terminal text-rose-500"></i>
                    <span>戰術對決動態 Log (System Execution)</span>
                </div>
                <span class="text-[10px] text-slate-500 font-mono">公平性系統自動結算中</span>
            </div>
            <div id="spec-log-box" class="text-xs space-y-1 font-mono text-slate-300 max-h-36 overflow-y-auto bg-slate-950/60 p-3 rounded-lg border border-slate-800/80">
                <div>[系統] 雲端遊戲連線成功，等待玩家提交決策。</div>
            </div>
        </div>
    </main>

    <!-- Modal for Settings & PIN list (僅限 GM 控制端開啟) -->
    <div id="setup-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-6">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-user-shield text-amber-400"></i>
                    <span>👑 GM 房間與玩家 PIN 碼管理</span>
                </h3>
                <button onclick="toggleSetupModal()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- 人數設定 -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">設定參與人數 (3 - 5 人)</label>
                <div class="grid grid-cols-3 gap-3">
                    <button onclick="changePlayerLimit(3)" id="btn-p-3" class="py-2 rounded-xl font-bold border transition text-sm">3 人賽制</button>
                    <button onclick="changePlayerLimit(4)" id="btn-p-4" class="py-2 rounded-xl font-bold border transition text-sm">4 人賽制</button>
                    <button onclick="changePlayerLimit(5)" id="btn-p-5" class="py-2 rounded-xl font-bold border transition text-sm">5 人賽制</button>
                </div>
            </div>

            <!-- PIN 碼清單 (僅在 GM 彈窗內部顯示) -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">各玩家登入 PIN 碼 (請由 GM 提供給對應玩家)</label>
                <div id="pin-list-container" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
            </div>

            <div class="pt-4 border-t border-slate-800 flex justify-between items-center">
                <button onclick="resetGameWithPins()" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm transition flex items-center space-x-2">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>重置比賽並生成新 PIN 碼</span>
                </button>
                <button onclick="toggleSetupModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm transition">
                    關閉
                </button>
            </div>
        </div>
    </div>

    <footer class="bg-slate-900 border-t border-slate-800 p-4 text-center text-slate-500 text-xs">
        三方/多方對決策略猜拳 Tactical RPS System &copy; 2026
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDKhojw0MWwn88AmP-tG9lOe9Q67RNRt7g",
            authDomain: "mini-game-214dd.firebaseapp.com",
            databaseURL: "https://mini-game-214dd-default-rtdb.firebaseio.com",
            projectId: "mini-game-214dd",
            storageBucket: "mini-game-214dd.firebasestorage.app",
            messagingSenderId: "972053611236",
            appId: "1:972053611236:web:d972943853d27d7a8962f1",
            measurementId: "G-55RXYHLB3H"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const AVATARS = [
            'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
            'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80',
            'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80',
            'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150&auto=format&fit=crop&q=80',
            'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=150&auto=format&fit=crop&q=80'
        ];

        let gameState = {
            playerCount: 3,
            round: 1,
            players: {},
            resolvedAttacks: []
        };

        let isGM = false; // 是否為 GM 端

        function generateRandomPin() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        function initPlayers(count) {
            const players = {};
            for (let i = 1; i <= count; i++) {
                const pid = `p${i}`;
                players[pid] = {
                    id: pid,
                    name: `玩家 ${String.fromCharCode(64 + i)}`,
                    lives: 3,
                    pin: generateRandomPin(),
                    target: null,
                    gesture: null,
                    locked: false,
                    revealTarget: false,
                    revealGesture: false,
                    avatar: AVATARS[i - 1]
                };
            }
            return players;
        }

        window.addEventListener('DOMContentLoaded', () => {
            // 判斷網址是否有帶 ?role=gm 或 ?gm=true
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('role') === 'gm' || urlParams.get('gm') === 'true') {
                isGM = true;
                document.getElementById('gm-control-btn').classList.remove('hidden');
                document.getElementById('gm-badge').classList.remove('hidden');
            }

            renderQRCode();
            
            db.ref('rps_game_state').on('value', (snapshot) => {
                const val = snapshot.val();
                if (val && val.players) {
                    gameState = val;
                    handleEliminations();
                    renderUI();
                    if (isGM) {
                        renderPinList();
                    }
                } else {
                    gameState.playerCount = 3;
                    gameState.players = initPlayers(3);
                    db.ref('rps_game_state').set(gameState);
                }
            });
        });

        function handleEliminations() {
            let aliveCount = 0;
            let winnerName = "";

            Object.keys(gameState.players).forEach(pid => {
                const p = gameState.players[pid];
                if (p) {
                    if (p.lives <= 0) {
                        p.lives = 0;
                        p.locked = true;
                        p.target = null;
                        p.gesture = null;
                    } else {
                        aliveCount++;
                        winnerName = p.name;
                    }
                }
            });

            if (aliveCount === 1 && !gameState.gameOver) {
                gameState.gameOver = true;
                gameState.winner = winnerName;
            }
        }

        function renderQRCode() {
            const loginUrl = "https://eason970206.github.io/mini-game/login.html";
            document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(loginUrl)}`;
        }

        function renderUI() {
            document.getElementById('spec-round-num').textContent = gameState.round;
            document.getElementById('player-count-tag').textContent = `${gameState.playerCount} 人賽制`;
            
            const container = document.getElementById('spec-cards-container');
            container.innerHTML = '';

            // 動態 RWD Grid
            if (gameState.playerCount === 4) {
                container.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6";
            } else if (gameState.playerCount === 5) {
                container.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4";
            } else {
                container.className = "grid grid-cols-1 md:grid-cols-3 gap-6";
            }

            const gestureIcons = { rock: '✊ 石頭', scissors: '✌️ 剪刀', paper: '🖐️ 布' };

            Object.keys(gameState.players).forEach(pid => {
                const p = gameState.players[pid] || {};
                const isDead = (p.lives <= 0);

                const card = document.createElement('div');
                card.className = `spec-p-card border rounded-2xl p-5 flex flex-col justify-between shadow-lg relative overflow-hidden transition-all duration-300 ${
                    isDead 
                        ? 'bg-slate-900/40 border-slate-800 opacity-50 grayscale' 
                        : 'bg-slate-800/60 border-slate-700/80 hover:border-slate-600'
                }`;

                let heartsHtml = '';
                for (let i = 0; i < 3; i++) {
                    heartsHtml += `<i class="${i < p.lives ? 'fa-solid fa-heart text-rose-500' : 'fa-regular fa-heart opacity-30 text-slate-500'} text-base mr-1"></i>`;
                }

                let statusBadgeHtml = '';
                if (isDead) {
                    statusBadgeHtml = `<div class="mt-3 text-center py-1.5 px-3 rounded-lg text-xs font-bold bg-rose-950/60 text-rose-400 border border-rose-800/50">💀 已淘汰 (OUT)</div>`;
                } else if (p.locked) {
                    statusBadgeHtml = `<div class="mt-3 text-center py-1.5 px-3 rounded-lg text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">🔒 決策已鎖定</div>`;
                } else {
                    statusBadgeHtml = `<div class="mt-3 text-center py-1.5 px-3 rounded-lg text-xs font-bold bg-slate-700/50 text-slate-400 border border-slate-600">⏳ 思考決策中...</div>`;
                }

                card.innerHTML = `
                    <div>
                        <div class="flex items-center space-x-3">
                            <img class="w-14 h-14 rounded-full border-2 border-slate-600 object-cover shadow-md" src="${p.avatar || AVATARS[0]}">
                            <div class="overflow-hidden">
                                <h3 class="font-black text-lg text-white truncate flex items-center gap-1.5">
                                    <span>${p.name || '--'}</span>
                                    ${isDead ? '<span class="text-[10px] bg-rose-600 text-white px-1.5 py-0.5 rounded font-normal">死亡</span>' : ''}
                                </h3>
                                <div class="flex items-center mt-1">${heartsHtml}</div>
                            </div>
                        </div>
                        ${statusBadgeHtml}
                    </div>

                    <div class="grid grid-cols-2 gap-2 mt-4">
                        <!-- 目標卡 -->
                        <div class="flip-card card-target h-24 w-full ${p.revealTarget ? 'flipped' : ''}">
                            <div class="flip-card-inner relative w-full h-full rounded-xl shadow-md border border-slate-700">
                                <div class="flip-card-front absolute inset-0 bg-slate-900 rounded-xl flex flex-col items-center justify-center p-2 text-slate-500">
                                    <i class="fa-solid fa-crosshairs text-xl mb-1 text-slate-600"></i>
                                    <span class="text-[11px] font-bold">攻擊目標</span>
                                </div>
                                <div class="flip-card-back absolute inset-0 bg-gradient-to-br from-slate-900 to-rose-950/80 rounded-xl border border-rose-500/50 flex flex-col items-center justify-center p-2">
                                    <span class="text-[9px] text-rose-400 font-bold uppercase">指定對象</span>
                                    <span class="font-black text-slate-100 text-sm mt-1 text-center truncate w-full">${p.target && gameState.players[p.target] ? gameState.players[p.target].name : '--'}</span>
                                </div>
                            </div>
                        </div>

                        <!-- 手勢卡 -->
                        <div class="flip-card card-gesture h-24 w-full ${p.revealGesture ? 'flipped' : ''}">
                            <div class="flip-card-inner relative w-full h-full rounded-xl shadow-md border border-slate-700">
                                <div class="flip-card-front absolute inset-0 bg-slate-900 rounded-xl flex flex-col items-center justify-center p-2 text-slate-500">
                                    <i class="fa-solid fa-hand text-xl mb-1 text-slate-600"></i>
                                    <span class="text-[11px] font-bold">出拳手勢</span>
                                </div>
                                <div class="flip-card-back absolute inset-0 bg-gradient-to-br from-slate-900 to-amber-950/80 rounded-xl border border-amber-500/50 flex flex-col items-center justify-center p-2">
                                    <span class="text-[9px] text-amber-400 font-bold uppercase">出拳手勢</span>
                                    <span class="font-black text-amber-300 text-sm mt-1">${p.gesture ? gestureIcons[p.gesture] : '--'}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            if (isGM) {
                updateModalButtons();
            }
        }

        function renderPinList() {
            const listContainer = document.getElementById('pin-list-container');
            if (!listContainer) return;
            
            listContainer.innerHTML = '';

            Object.keys(gameState.players).forEach(pid => {
                const p = gameState.players[pid];
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-slate-800 p-3 rounded-xl border border-slate-700";
                item.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <img src="${p.avatar}" class="w-8 h-8 rounded-full border border-slate-600">
                        <span class="font-bold text-white text-sm">${p.name}</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-xs text-slate-400">PIN 碼:</span>
                        <span class="font-mono font-black text-amber-400 text-base bg-slate-900 px-3 py-1 rounded-lg border border-slate-700 tracking-wider">${p.pin}</span>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        function updateModalButtons() {
            [3, 4, 5].forEach(num => {
                const btn = document.getElementById(`btn-p-${num}`);
                if (!btn) return;
                if (num === gameState.playerCount) {
                    btn.className = "py-2 rounded-xl font-bold border transition text-sm bg-rose-600 border-rose-500 text-white shadow-lg";
                } else {
                    btn.className = "py-2 rounded-xl font-bold border transition text-sm bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700";
                }
            });
        }

        function toggleSetupModal() {
            if (!isGM) return; // 非 GM 端不執行
            const modal = document.getElementById('setup-modal');
            modal.classList.toggle('hidden');
        }

        function changePlayerLimit(count) {
            if (!isGM) return;
            if (confirm(`【GM 操作】確定要切換為 ${count} 人賽制並重置局數與生成新 PIN 碼嗎？`)) {
                gameState.playerCount = count;
                gameState.round = 1;
                gameState.players = initPlayers(count);
                gameState.gameOver = false;
                db.ref('rps_game_state').set(gameState);
            }
        }

        function resetGameWithPins() {
            if (!isGM) return;
            if (confirm("【GM 操作】確定要重置比賽並為所有玩家產生新的登入 PIN 碼嗎？")) {
                gameState.round = 1;
                gameState.gameOver = false;
                gameState.players = initPlayers(gameState.playerCount);
                db.ref('rps_game_state').set(gameState);
            }
        }
    </script>
</body>
</html>
