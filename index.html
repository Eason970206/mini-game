<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三方對決策略猜拳 - 觀賽大螢幕</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .flip-card { perspective: 1000px; }
        .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .flip-card-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-rose-500 selection:text-white">

    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-hand-back-fist text-rose-500 text-3xl"></i>
                <span class="font-extrabold text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-rose-500 to-amber-400">三方對決 RPS</span>
            </div>
            <a href="login.html" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm transition border border-slate-700">
                <i class="fa-solid fa-right-to-bracket mr-1"></i> 登入門戶
            </a>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
        <div class="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 border border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col md:flex-row items-center justify-between gap-6">
            <div>
                <span class="bg-rose-500/20 text-rose-400 text-xs font-extrabold px-3 py-1 rounded-full uppercase tracking-wider border border-rose-500/30">
                    Live Arena (Firebase Online)
                </span>
                <h1 class="text-3xl md:text-4xl font-black text-white mt-2">
                    第 <span id="spec-round-num" class="text-amber-400">1</span> 回合 觀賽大螢幕
                </h1>
                <p class="text-slate-400 text-sm mt-1">請使用手機掃描右側 QR Code 進入登入頁面開玩</p>
            </div>

            <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 flex items-center space-x-4 shadow-inner">
                <div id="qrcode-container" class="bg-white p-1 rounded-lg flex items-center justify-center">
                    <img id="qr-img" src="" alt="QR Code" class="w-20 h-20">
                </div>
                <div class="text-xs space-y-1">
                    <div class="font-bold text-slate-300">掃描手機加入</div>
                    <div class="text-slate-500">掃碼輸入 PIN 碼參與</div>
                </div>
            </div>
        </div>

        <!-- 玩家面板 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="spec-cards-container"></div>

        <!-- 戰況紀錄 -->
        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
            <div class="flex items-center space-x-2 text-xs font-bold text-slate-400 mb-2">
                <i class="fa-solid fa-scroll text-rose-500"></i>
                <span>戰術實況動態 Log</span>
            </div>
            <div id="spec-log-box" class="text-xs space-y-1 font-mono text-slate-300 max-h-32 overflow-y-auto">
                <div>[系統] 雲端連線成功，等待玩家提交決策。</div>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 p-4 text-center text-slate-500 text-xs">
        三方對決策略猜拳 Tactical RPS System &copy; 2026
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDKhojw0MWwn88AmP-tG9lOe9Q67RNRt7g",
            authDomain: "mini-game-214dd.firebaseapp.com",
            databaseURL: "https://mini-game-214dd-default-rtdb.firebaseio.com",
            projectId: "mini-game-214dd",
            storageBucket: "mini-game-214dd.firebasestorage.app",
            messagingSenderId: "972053611236",
            appId: "1:972053611236:web:d972943853d27d7a8962f1",
            measurementId: "G-55RXYHLB3H"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const PLAYER_CONFIG = {
            p1: { avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80' },
            p2: { avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80' },
            p3: { avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80' }
        };

        let gameState = {
            round: 1,
            players: {
                p1: { name: '玩家 A', lives: 3, target: null, gesture: null, locked: false, revealTarget: false, revealGesture: false },
                p2: { name: '玩家 B', lives: 3, target: null, gesture: null, locked: false, revealTarget: false, revealGesture: false },
                p3: { name: '玩家 C', lives: 3, target: null, gesture: null, locked: false, revealTarget: false, revealGesture: false }
            },
            resolvedAttacks: []
        };

        window.addEventListener('DOMContentLoaded', () => {
            renderQRCode();
            
            db.ref('rps_game_state').on('value', (snapshot) => {
                const val = snapshot.val();
                if (val) {
                    gameState = val;
                    // 自動鎖定並將血量 <= 0 的死亡玩家排除
                    handleEliminations();
                    renderUI();
                } else {
                    db.ref('rps_game_state').set(gameState);
                }
            });
        });

        function handleEliminations() {
            let alivePlayers = [];
            
            ['p1', 'p2', 'p3'].forEach(pid => {
                const p = gameState.players[pid];
                if (p) {
                    if (p.lives <= 0) {
                        // 死亡玩家自動鎖定，且無法進行動作
                        p.locked = true;
                        p.target = null;
                        p.gesture = null;
                    } else {
                        alivePlayers.push(p);
                    }
                }
            });

            // 如果只剩 1 個倖存者，遊戲勝利
            if (alivePlayers.length === 1 && !gameState.gameOver) {
                gameState.gameOver = true;
                gameState.winner = alivePlayers[0].name;
            }
        }

        function renderQRCode() {
            const loginUrl = "https://eason970206.github.io/mini-game/login.html";
            document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(loginUrl)}`;
        }

        function renderUI() {
            document.getElementById('spec-round-num').textContent = gameState.round;
            const container = document.getElementById('spec-cards-container');
            container.innerHTML = '';

            const gestureIcons = { rock: '✊ 石頭', scissors: '✌️ 剪刀', paper: '🖐️ 布' };

            ['p1', 'p2', 'p3'].forEach(pid => {
                const p = gameState.players[pid] || {};
                const isDead = (p.lives <= 0);

                const card = document.createElement('div');
                card.className = `spec-p-card border rounded-2xl p-5 flex flex-col justify-between shadow-lg relative overflow-hidden transition-all duration-300 ${
                    isDead 
                        ? 'bg-slate-900/40 border-slate-800 opacity-50 grayscale' 
                        : 'bg-slate-800/60 border-slate-700/80'
                }`;
                card.id = `spec-card-${pid}`;

                let heartsHtml = '';
                for (let i = 0; i < 3; i++) {
                    heartsHtml += `<i class="${i < p.lives ? 'fa-solid fa-heart text-rose-500' : 'fa-regular fa-heart opacity-30 text-slate-500'} text-lg mr-1"></i>`;
                }

                let statusBadgeHtml = '';
                if (isDead) {
                    statusBadgeHtml = `<div class="mt-4 text-center py-1.5 px-3 rounded-lg text-xs font-bold bg-rose-950/60 text-rose-400 border border-rose-800/50">💀 已淘汰 (OUT)</div>`;
                } else if (p.locked) {
                    statusBadgeHtml = `<div class="mt-4 text-center py-1.5 px-3 rounded-lg text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">🔒 戰術決策已鎖定</div>`;
                } else {
                    statusBadgeHtml = `<div class="mt-4 text-center py-1.5 px-3 rounded-lg text-xs font-bold bg-slate-700/50 text-slate-400 border border-slate-600">⏳ 等待決定手勢與目標...</div>`;
                }

                card.innerHTML = `
                    <div>
                        <div class="flex items-center space-x-4">
                            <img class="w-16 h-16 rounded-full border-2 border-slate-600 object-cover shadow-md" src="${PLAYER_CONFIG[pid].avatar}">
                            <div>
                                <h3 class="font-black text-xl text-white flex items-center gap-2">
                                    ${p.name || '--'}
                                    ${isDead ? '<span class="text-xs bg-rose-600 text-white px-2 py-0.5 rounded font-normal">死亡</span>' : ''}
                                </h3>
                                <div class="flex mt-1">${heartsHtml}</div>
                            </div>
                        </div>
                        ${statusBadgeHtml}
                    </div>

                    <div class="grid grid-cols-2 gap-3 mt-6">
                        <!-- 目標卡 -->
                        <div class="flip-card card-target h-28 w-full ${p.revealTarget ? 'flipped' : ''}">
                            <div class="flip-card-inner relative w-full h-full rounded-xl shadow-md border border-slate-700">
                                <div class="flip-card-front absolute inset-0 bg-slate-900 rounded-xl flex flex-col items-center justify-center p-2 text-slate-500">
                                    <i class="fa-solid fa-crosshairs text-2xl mb-1 text-slate-600"></i>
                                    <span class="text-xs font-bold">攻擊目標</span>
                                </div>
                                <div class="flip-card-back absolute inset-0 bg-gradient-to-br from-slate-900 to-rose-950/80 rounded-xl border border-rose-500/50 flex flex-col items-center justify-center p-2">
                                    <span class="text-[10px] text-rose-400 font-bold uppercase">指定對象</span>
                                    <span class="font-black text-slate-100 text-base mt-1 text-center">${p.target && gameState.players[p.target] ? gameState.players[p.target].name : '--'}</span>
                                </div>
                            </div>
                        </div>

                        <!-- 手勢卡 -->
                        <div class="flip-card card-gesture h-28 w-full ${p.revealGesture ? 'flipped' : ''}">
                            <div class="flip-card-inner relative w-full h-full rounded-xl shadow-md border border-slate-700">
                                <div class="flip-card-front absolute inset-0 bg-slate-900 rounded-xl flex flex-col items-center justify-center p-2 text-slate-500">
                                    <i class="fa-solid fa-hand text-2xl mb-1 text-slate-600"></i>
                                    <span class="text-xs font-bold">手勢</span>
                                </div>
                                <div class="flip-card-back absolute inset-0 bg-gradient-to-br from-slate-900 to-amber-950/80 rounded-xl border border-amber-500/50 flex flex-col items-center justify-center p-2">
                                    <span class="text-[10px] text-amber-400 font-bold uppercase">出拳手勢</span>
                                    <span class="font-black text-amber-300 text-lg mt-1">${p.gesture ? gestureIcons[p.gesture] : '--'}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
