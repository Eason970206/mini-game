<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入門戶 - 三方對決 RPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4">

    <div class="w-full max-w-md space-y-6">
        <div class="text-center space-y-2">
            <div class="inline-block p-4 bg-slate-800 rounded-full border-2 border-rose-500/30 mb-2">
                <i class="fa-solid fa-shield-halved text-4xl text-rose-500"></i>
            </div>
            <h2 class="text-3xl font-black text-white">身分驗證入口</h2>
            <p class="text-slate-400 text-sm">請選擇您的身份並輸入個人 PIN 碼</p>
        </div>

        <div class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-2xl space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">選擇進入身份</label>
                <select id="login-role" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 font-bold text-slate-200 focus:outline-none focus:border-rose-500">
                    <option value="p1">玩家 A (Player 1)</option>
                    <option value="p2">玩家 B (Player 2)</option>
                    <option value="p3">玩家 C (Player 3)</option>
                    <option value="gm">中控台控制員 (GM)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">PIN 驗證碼</label>
                <input type="password" id="login-pin" maxlength="6" placeholder="請輸入 4 位數 PIN 碼" 
                       class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-2xl font-mono tracking-widest text-rose-400 focus:outline-none focus:border-rose-500">
            </div>

            <button onclick="submitLogin()" class="w-full bg-gradient-to-r from-rose-600 to-amber-600 hover:from-rose-500 hover:to-amber-500 text-white font-extrabold py-3.5 rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>驗證並進入</span>
            </button>

            <div id="login-error" class="hidden text-center text-xs font-bold text-rose-500 bg-rose-500/10 py-2 rounded-lg border border-rose-500/20">
                ❌ PIN 碼驗證失敗，請確認無誤後重試！
            </div>
        </div>

        <div class="text-center">
            <a href="index.html" class="text-xs text-slate-500 hover:text-slate-300 underline">
                返回大螢幕觀賽 View
            </a>
        </div>
    </div>

    <script>
        const PINS = {
            p1: '1111',
            p2: '2222',
            p3: '3333',
            gm: '8805'
        };

        function submitLogin() {
            const role = document.getElementById('login-role').value;
            const pin = document.getElementById('login-pin').value.trim();
            const errorEl = document.getElementById('login-error');

            if (pin === PINS[role]) {
                errorEl.classList.add('hidden');
                if (role === 'gm') {
                    sessionStorage.setItem('gm_authenticated', 'true');
                    window.location.href = 'gm.html';
                } else {
                    window.location.href = `player.html?id=${role}`;
                }
            } else {
                errorEl.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
