<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩家登入 - 多方戰術對決</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-rose-500 selection:text-white">

    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl space-y-6 relative overflow-hidden">
        
        <!-- Top Decoration -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-rose-500/10 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl"></div>

        <div class="text-center space-y-2 relative z-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-slate-800 border border-slate-700 text-rose-500 mb-2 shadow-inner">
                <i class="fa-solid fa-gamepad text-3xl"></i>
            </div>
            <h1 class="text-2xl font-black text-white tracking-wider">玩家戰術登入門戶</h1>
            <p class="text-xs text-slate-400">請選擇您的身份並輸入 GM 提供之專屬 PIN 碼</p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5 relative z-10">
            <!-- 動態玩家選擇選單 -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block">選擇玩家身份</label>
                <div class="relative">
                    <select id="player-select" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white font-bold text-sm focus:outline-none focus:border-rose-500 transition appearance-none cursor-pointer">
                        <option value="" disabled selected>載入房間資訊中...</option>
                    </select>
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>
                </div>
            </div>

            <!-- PIN 碼輸入框 -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block">輸入登入 PIN 碼 (4 位數)</label>
                <div class="relative">
                    <input type="password" id="pin-input" maxlength="4" placeholder="請輸入 4 位數字 PIN 碼" required
                           class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-amber-400 font-mono font-black text-lg tracking-widest text-center focus:outline-none focus:border-amber-400 transition placeholder:text-slate-600 placeholder:text-sm placeholder:font-sans placeholder:tracking-normal">
                </div>
            </div>

            <!-- 錯誤訊息提示 -->
            <div id="error-msg" class="hidden bg-rose-950/60 border border-rose-800/60 text-rose-300 text-xs py-2.5 px-4 rounded-xl text-center font-bold flex items-center justify-center gap-2">
                <i class="fa-solid fa-circle-exclamation text-rose-400"></i>
                <span id="error-text">PIN 碼錯誤，請重新輸入</span>
            </div>

            <button type="submit" id="submit-btn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-rose-600 to-amber-500 hover:from-rose-500 hover:to-amber-400 text-white font-black text-base shadow-lg shadow-rose-950/50 transition transform active:scale-95 flex items-center justify-center space-x-2">
                <span>進入控制介面</span>
                <i class="fa-solid fa-arrow-right text-sm"></i>
            </button>
        </form>

        <div class="text-center text-[11px] text-slate-500 border-t border-slate-800/80 pt-4">
            請向 GM 索取對應身份之 PIN 碼以參與競賽
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDKhojw0MWwn88AmP-tG9lOe9Q67RNRt7g",
            authDomain: "mini-game-214dd.firebaseapp.com",
            databaseURL: "https://mini-game-214dd-default-rtdb.firebaseio.com",
            projectId: "mini-game-214dd",
            storageBucket: "mini-game-214dd.firebasestorage.app",
            messagingSenderId: "972053611236",
            appId: "1:972053611236:web:d972943853d27d7a8962f1",
            measurementId: "G-55RXYHLB3H"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentPlayers = {};

        window.addEventListener('DOMContentLoaded', () => {
            // 即時監聽 Firebase 房間狀態，動態生成選單選項
            db.ref('rps_game_state/players').on('value', (snapshot) => {
                const players = snapshot.val();
                if (players) {
                    currentPlayers = players;
                    updatePlayerDropdown(players);
                }
            });
        });

        function updatePlayerDropdown(players) {
            const select = document.getElementById('player-select');
            const currentValue = select.value;
            select.innerHTML = '<option value="" disabled selected>-- 請選擇您的玩家身份 --</option>';

            Object.keys(players).forEach(pid => {
                const p = players[pid];
                const isDead = (p.lives <= 0);
                const option = document.createElement('option');
                option.value = pid;
                option.disabled = isDead; // 死亡玩家禁止選擇
                option.textContent = `${p.name} ${isDead ? '(💀 已淘汰)' : `(❤️ x ${p.lives})`}`;
                select.appendChild(option);
            });

            if (currentValue && players[currentValue] && players[currentValue].lives > 0) {
                select.value = currentValue;
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const selectedPid = document.getElementById('player-select').value;
            const inputPin = document.getElementById('pin-input').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');

            errorMsg.classList.add('hidden');

            if (!selectedPid) {
                showError("請先選擇您的玩家身份！");
                return;
            }

            const targetPlayer = currentPlayers[selectedPid];
            if (!targetPlayer) {
                showError("找不到該玩家資料，請重新嘗試。");
                return;
            }

            if (targetPlayer.lives <= 0) {
                showError("該玩家已被淘汰，無法登入！");
                return;
            }

            // 比對 Firebase 上的隨機 PIN 碼
            if (inputPin === targetPlayer.pin) {
                // 驗證成功：將 PID 記錄至 localStorage 並跳轉至玩家操作頁面
                localStorage.setItem('rps_player_id', selectedPid);
                window.location.href = `player.html?pid=${selectedPid}`;
            } else {
                showError("PIN 碼不正確，請向 GM 確認！");
            }
        }

        function showError(msg) {
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');
            errorText.textContent = msg;
            errorMsg.classList.remove('hidden');
        }
    </script>
</body>
</html>
