<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩家戰術操作頁面</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4">

    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl space-y-6">
        <div class="flex items-center justify-between border-b border-slate-700 pb-4">
            <div class="flex items-center space-x-3">
                <img id="p-avatar" class="w-14 h-14 rounded-full border-2 border-rose-500 object-cover" src="">
                <div>
                    <h2 id="p-name" class="text-2xl font-black text-white">--</h2>
                    <div class="text-xs text-slate-400 font-mono">第 <span id="p-round">1</span> 回合 操作面板</div>
                </div>
            </div>
            <div>
                <span class="text-[10px] text-slate-400 block font-bold uppercase text-right">剩餘生命</span>
                <div id="p-hearts" class="flex space-x-1 text-rose-500 text-xl mt-0.5"></div>
            </div>
        </div>

        <div id="p-lock-notice" class="hidden bg-emerald-500/10 border border-emerald-500/30 p-3 rounded-xl text-center text-xs text-emerald-400 font-bold">
            ✅ 本回合決策已傳送，請觀看大螢幕等待結果揭曉！
        </div>

        <div class="space-y-3">
            <label class="block text-xs font-bold text-slate-300 uppercase">1. 選擇指定扣血對象</label>
            <div id="p-targets" class="grid grid-cols-2 gap-3"></div>
        </div>

        <div class="space-y-3">
            <label class="block text-xs font-bold text-slate-300 uppercase">2. 選擇手勢</label>
            <div class="grid grid-cols-3 gap-3">
                <button onclick="selectGesture('rock')" id="g-rock" class="g-btn flex flex-col items-center p-4 bg-slate-900 border-2 border-slate-700 rounded-xl">
                    <span class="text-3xl mb-1">✊</span><span class="text-xs font-bold">石頭</span>
                </button>
                <button onclick="selectGesture('scissors')" id="g-scissors" class="g-btn flex flex-col items-center p-4 bg-slate-900 border-2 border-slate-700 rounded-xl">
                    <span class="text-3xl mb-1">✌️</span><span class="text-xs font-bold">剪刀</span>
                </button>
                <button onclick="selectGesture('paper')" id="g-paper" class="g-btn flex flex-col items-center p-4 bg-slate-900 border-2 border-slate-700 rounded-xl">
                    <span class="text-3xl mb-1">🖐️</span><span class="text-xs font-bold">布</span>
                </button>
            </div>
        </div>

        <button id="p-submit" onclick="submitDecision()" disabled class="w-full py-4 bg-gradient-to-r from-rose-600 to-amber-600 text-white font-extrabold rounded-xl shadow-lg transition disabled:opacity-40">
            <i class="fa-solid fa-lock mr-2"></i> 鎖定並送出決定
        </button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const playerId = urlParams.get('id') || 'p1';

        const PLAYER_CONFIG = {
            p1: { avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80' },
            p2: { avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80' },
            p3: { avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80' }
        };

        let gameState = {
            round: 1,
            players: {
                p1: { name: '玩家 A', lives: 3, target: null, gesture: null, locked: false },
                p2: { name: '玩家 B', lives: 3, target: null, gesture: null, locked: false },
                p3: { name: '玩家 C', lives: 3, target: null, gesture: null, locked: false }
            }
        };

        let tempTarget = null;
        let tempGesture = null;

        const broadcastChannel = new BroadcastChannel('rps_game_sync');

        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            renderUI();

            broadcastChannel.onmessage = (e) => {
                if (e.data && e.data.type === 'STATE_UPDATE') {
                    gameState = e.data.state;
                    renderUI();
                }
            };
        });

        function loadState() {
            const saved = localStorage.getItem('rps_game_state');
            if (saved) { try { gameState = JSON.parse(saved); } catch(e){} }
        }

        function saveAndBroadcast() {
            localStorage.setItem('rps_game_state', JSON.stringify(gameState));
            broadcastChannel.postMessage({ type: 'STATE_UPDATE', state: gameState });
            renderUI();
        }

        function selectTarget(tid) {
            if (gameState.players[playerId].locked) return;
            tempTarget = tid;
            updateSelectionUI();
        }

        function selectGesture(g) {
            if (gameState.players[playerId].locked) return;
            tempGesture = g;
            updateSelectionUI();
        }

        function updateSelectionUI() {
            document.querySelectorAll('.t-btn').forEach(b => b.classList.replace('border-rose-500', 'border-slate-700'));
            if (tempTarget) {
                const b = document.getElementById(`t-${tempTarget}`);
                if (b) b.classList.replace('border-slate-700', 'border-rose-500');
            }

            document.querySelectorAll('.g-btn').forEach(b => b.classList.replace('border-amber-500', 'border-slate-700'));
            if (tempGesture) {
                const b = document.getElementById(`g-${tempGesture}`);
                if (b) b.classList.replace('border-slate-700', 'border-amber-500');
            }

            const sub = document.getElementById('p-submit');
            if (!gameState.players[playerId].locked && tempTarget && tempGesture) {
                sub.disabled = false;
            } else {
                sub.disabled = true;
            }
        }

        function submitDecision() {
            gameState.players[playerId].target = tempTarget;
            gameState.players[playerId].gesture = tempGesture;
            gameState.players[playerId].locked = true;
            saveAndBroadcast();
        }

        function renderUI() {
            const p = gameState.players[playerId];
            document.getElementById('p-avatar').src = PLAYER_CONFIG[playerId].avatar;
            document.getElementById('p-name').textContent = p.name;
            document.getElementById('p-round').textContent = gameState.round;

            let heartsHtml = '';
            for (let i = 0; i < 3; i++) {
                heartsHtml += `<i class="${i < p.lives ? 'fa-solid fa-heart' : 'fa-regular fa-heart opacity-30'} text-rose-500"></i>`;
            }
            document.getElementById('p-hearts').innerHTML = heartsHtml;

            const targetContainer = document.getElementById('p-targets');
            targetContainer.innerHTML = '';
            ['p1', 'p2', 'p3'].filter(id => id !== playerId).forEach(oppId => {
                const btn = document.createElement('button');
                btn.id = `t-${oppId}`;
                btn.className = `t-btn flex items-center space-x-3 p-3 bg-slate-900 border-2 border-slate-700 rounded-xl text-left`;
                btn.onclick = () => selectTarget(oppId);
                btn.innerHTML = `<img src="${PLAYER_CONFIG[oppId].avatar}" class="w-8 h-8 rounded-full object-cover"><span class="font-bold text-sm">${gameState.players[oppId].name}</span>`;
                targetContainer.appendChild(btn);
            });

            if (p.locked) {
                document.getElementById('p-lock-notice').classList.remove('hidden');
                document.getElementById('p-submit').textContent = '✅ 已完成鎖定';
            } else {
                document.getElementById('p-lock-notice').classList.add('hidden');
                document.getElementById('p-submit').innerHTML = '<i class="fa-solid fa-lock mr-2"></i> 鎖定並送出決定';
            }
            updateSelectionUI();
        }
    </script>
</body>
</html>
