<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩家戰術面板 - 多方戰術對決</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-rose-500 selection:text-white">

    <!-- 防直接網址存取驗證 -->
    <script>
        const activePid = sessionStorage.getItem('rps_auth_pid');
        if (!activePid) {
            alert("⚠️ 未授權的存取！請透過登入頁面輸入 PIN 碼登入。");
            window.location.href = "login.html";
        }
    </script>

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img id="my-avatar" class="w-10 h-10 rounded-full border-2 border-rose-500 object-cover" src="" alt="Avatar">
                <div>
                    <h2 id="my-name" class="font-black text-base text-white">載入中...</h2>
                    <div id="my-hearts" class="flex items-center text-xs"></div>
                </div>
            </div>
            
            <button onclick="logout()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs font-bold transition">
                <i class="fa-solid fa-right-from-bracket mr-1"></i>登出
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-md w-full mx-auto p-4 space-y-6 flex flex-col justify-center">

        <!-- Round Banner -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center space-y-1 shadow-lg">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">CURRENT ROUND</span>
            <div class="text-3xl font-black text-amber-400">第 <span id="round-num">1</span> 回合</div>
        </div>

        <!-- 淘汰提示 -->
        <div id="eliminated-banner" class="hidden bg-rose-950/80 border border-rose-800 text-rose-300 p-6 rounded-2xl text-center space-y-2 shadow-2xl">
            <i class="fa-solid fa-skull-crossbones text-4xl text-rose-500 mb-2"></i>
            <h3 class="text-xl font-black">您已被淘汰 (OUT)</h3>
            <p class="text-xs text-rose-300/80">您的生命值已歸零，無法再進行攻擊或出拳，請觀賞比賽結果！</p>
        </div>

        <!-- 決策卡片 -->
        <div id="action-card" class="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-2xl space-y-6">
            <div class="space-y-2">
                <label class="text-xs font-black text-rose-400 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-crosshairs"></i>
                    <span>1. 選擇戰術攻擊目標</span>
                </label>
                <div class="relative">
                    <select id="target-select" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-white font-bold text-sm focus:outline-none focus:border-rose-500 transition appearance-none cursor-pointer">
                        <option value="" disabled selected>-- 請選擇目標 --</option>
                    </select>
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-black text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-hand"></i>
                    <span>2. 選擇出拳手勢</span>
                </label>
                <div class="grid grid-cols-3 gap-3">
                    <button type="button" onclick="selectGesture('rock')" id="btn-rock" class="gesture-btn p-3 rounded-2xl border border-slate-700 bg-slate-950 hover:bg-slate-800 transition flex flex-col items-center justify-center space-y-1">
                        <span class="text-2xl">✊</span>
                        <span class="text-xs font-bold text-slate-300">石頭</span>
                    </button>
                    <button type="button" onclick="selectGesture('scissors')" id="btn-scissors" class="gesture-btn p-3 rounded-2xl border border-slate-700 bg-slate-950 hover:bg-slate-800 transition flex flex-col items-center justify-center space-y-1">
                        <span class="text-2xl">✌️</span>
                        <span class="text-xs font-bold text-slate-300">剪刀</span>
                    </button>
                    <button type="button" onclick="selectGesture('paper')" id="btn-paper" class="gesture-btn p-3 rounded-2xl border border-slate-700 bg-slate-950 hover:bg-slate-800 transition flex flex-col items-center justify-center space-y-1">
                        <span class="text-2xl">🖐️</span>
                        <span class="text-xs font-bold text-slate-300">布</span>
                    </button>
                </div>
            </div>

            <button id="lock-btn" onclick="submitDecision()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-rose-600 to-amber-500 hover:from-rose-500 hover:to-amber-400 text-white font-black text-base shadow-xl transition transform active:scale-95 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-lock"></i>
                <span>鎖定並送出決策</span>
            </button>
        </div>

        <div id="locked-banner" class="hidden bg-emerald-950/60 border border-emerald-800 text-emerald-300 p-6 rounded-3xl text-center space-y-2 shadow-xl">
            <i class="fa-solid fa-circle-check text-4xl text-emerald-400 mb-2"></i>
            <h3 class="text-lg font-black">決策已成功鎖定</h3>
            <p class="text-xs text-emerald-300/80">請看前方觀賽大螢幕，等待其他玩家提交決策！</p>
        </div>

    </main>

    <footer class="bg-slate-900 border-t border-slate-800 p-4 text-center text-slate-500 text-xs">
        三方/多方對決策略猜拳 Tactical RPS System &copy; 2026
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDKhojw0MWwn88AmP-tG9lOe9Q67RNRt7g",
            authDomain: "mini-game-214dd.firebaseapp.com",
            databaseURL: "https://mini-game-214dd-default-rtdb.firebaseio.com",
            projectId: "mini-game-214dd",
            storageBucket: "mini-game-214dd.firebasestorage.app",
            messagingSenderId: "972053611236",
            appId: "1:972053611236:web:d972943853d27d7a8962f1",
            measurementId: "G-55RXYHLB3H"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const myPid = sessionStorage.getItem('rps_auth_pid');
        let selectedGesture = null;
        let gameState = {};

        window.addEventListener('DOMContentLoaded', () => {
            db.ref('rps_game_state').on('value', (snapshot) => {
                const val = snapshot.val();
                if (val && val.players) {
                    gameState = val;
                    renderPlayerPanel();
                }
            });
        });

        function renderPlayerPanel() {
            const me = gameState.players[myPid];
            if (!me) {
                alert("房間已重置，請重新登入！");
                logout();
                return;
            }

            document.getElementById('my-name').textContent = me.name;
            document.getElementById('my-avatar').src = me.avatar;
            document.getElementById('round-num').textContent = gameState.round;

            let heartsHtml = '';
            for (let i = 0; i < 3; i++) {
                heartsHtml += `<i class="${i < me.lives ? 'fa-solid fa-heart text-rose-500' : 'fa-regular fa-heart opacity-30 text-slate-500'} mr-1"></i>`;
            }
            document.getElementById('my-hearts').innerHTML = heartsHtml;

            if (me.lives <= 0) {
                document.getElementById('eliminated-banner').classList.remove('hidden');
                document.getElementById('action-card').classList.add('hidden');
                document.getElementById('locked-banner').classList.add('hidden');
                return;
            } else {
                document.getElementById('eliminated-banner').classList.add('hidden');
            }

            if (me.locked) {
                document.getElementById('action-card').classList.add('hidden');
                document.getElementById('locked-banner').classList.remove('hidden');
            } else {
                document.getElementById('action-card').classList.remove('hidden');
                document.getElementById('locked-banner').classList.add('hidden');
                
                // 若後端重置為未選狀態，前端UI同步清空
                if (!me.target) {
                    document.getElementById('target-select').value = "";
                }
                if (!me.gesture) {
                    selectedGesture = null;
                    resetGestureButtons();
                }
                updateTargetDropdown();
            }
        }

        function resetGestureButtons() {
            ['rock', 'scissors', 'paper'].forEach(g => {
                const btn = document.getElementById(`btn-${g}`);
                btn.className = "gesture-btn p-3 rounded-2xl border border-slate-700 bg-slate-950 hover:bg-slate-800 transition flex flex-col items-center justify-center space-y-1";
            });
        }

        function updateTargetDropdown() {
            const select = document.getElementById('target-select');
            const currentSelected = select.value;
            select.innerHTML = '<option value="" disabled selected>-- 請選擇目標 --</option>';

            Object.keys(gameState.players).forEach(pid => {
                if (pid !== myPid) {
                    const p = gameState.players[pid];
                    if (p && p.lives > 0) {
                        const option = document.createElement('option');
                        option.value = pid;
                        option.textContent = `${p.name} (❤️ x ${p.lives})`;
                        select.appendChild(option);
                    }
                }
            });

            if (currentSelected) select.value = currentSelected;
        }

        function selectGesture(gesture) {
            selectedGesture = gesture;
            ['rock', 'scissors', 'paper'].forEach(g => {
                const btn = document.getElementById(`btn-${g}`);
                if (g === gesture) {
                    btn.className = "gesture-btn p-3 rounded-2xl border-2 border-amber-400 bg-amber-500/20 transition flex flex-col items-center justify-center space-y-1 shadow-lg";
                } else {
                    btn.className = "gesture-btn p-3 rounded-2xl border border-slate-700 bg-slate-950 hover:bg-slate-800 transition flex flex-col items-center justify-center space-y-1 opacity-60";
                }
            });
        }

        function submitDecision() {
            const targetPid = document.getElementById('target-select').value;
            if (!targetPid) return alert("請先選擇要攻擊的目標對象！");
            if (!selectedGesture) return alert("請選擇您的出拳手勢！");

            db.ref(`rps_game_state/players/${myPid}`).update({
                target: targetPid,
                gesture: selectedGesture,
                locked: true
            });
        }

        function logout() {
            sessionStorage.removeItem('rps_auth_pid');
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
